name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions

concurrency:
  group: deploy-produccion
  cancel-in-progress: false  # nunca cancelar un deploy a mitad de camino

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion  # exige la aprobación configurada en el paso 0.8c

    steps:
      - name: Actualizar código e instalar dependencias del backend
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          port:     ${{ secrets.VPS_PORT }}   # 5299 en DonWeb, NO el 22 por defecto
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ~/app

            # Deja el working tree EXACTAMENTE igual a origin/main.
            # Los .env estan gitignored, asi que no se tocan.
            git fetch --all
            git reset --hard origin/main

            # ORDEN OBLIGATORIO (riesgo #7): el frontend typecheckea contra
            # backend/generated/prisma, que genera el postinstall del backend.
            cd backend
            npm install

      # Paso aislado a proposito, con timeout corto (incidente 2026-09-02: un
      # ALTER TABLE quedo encolado 57 min detras de conexiones de ed-backend,
      # colgando logins e impresiones porque USUARIOS es una tabla caliente).
      # Con este step aparte, un deploy que choca contra un lock falla en
      # minutos -y libera el advisory lock de Prisma- en vez de agotar los
      # 15 minutos del step de build y dejar un proceso zombie del otro lado
      # de un SSH ya cortado.
      #
      # La defensa de fondo es a nivel de rol: `ALTER ROLE ed_app SET
      # lock_timeout = '5s'` (aplicado a mano en el VPS, no versionado —
      # Postgres no tiene "migracion de rol"). Cualquier DDL que esa cuenta
      # no pueda tomar en 5s aborta solo, sin depender de que cada migracion
      # futura se acuerde de declararlo.
      - name: Aplicar migraciones de la base
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          port:     ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd ~/app/backend
            npx prisma migrate deploy

      - name: Compilar y publicar el frontend, reiniciar el backend
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          port:     ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 10m     # el build del frontend puede tardar
          script: |
            set -euo pipefail
            SITIO=$HOME
            DOMINIO="edindumentaria.store"

            cd "$SITIO/app/frontend"
            npm install
            npm run build

            # Publicacion (riesgo #13): vite vacia dist/ antes de escribir, asi que
            # se compila aparte y se copia. La ventana de inconsistencia pasa de
            # varios segundos a una fraccion.
            rsync -a --delete dist/ "$SITIO/htdocs/$DOMINIO/"

            sudo systemctl restart ed-backend

            # Mantiene el venv al dia con requirements.txt SIN reiniciar el
            # servicio (ed-print no se reinicia en cada deploy a proposito:
            # cortaria las impresoras conectadas sin necesidad, ver el
            # comentario de ed-print.service). Que la dependencia ya este
            # instalada evita repetir el ModuleNotFoundError del 2026-09-02
            # la proxima vez que alguien reinicie el servicio a mano.
            "$SITIO/app/print-service/.venv/bin/pip" install -q -r "$SITIO/app/print-service/requirements.txt"

      - name: Verificar que quedó sano
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          port:     ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            sleep 5

            # psql se autentica con ~/.pgpass (el mismo que usa backup-db.sh).
            export PGUSER=ed_app PGHOST=localhost PGDATABASE=db_ed_indumentaria

            # ------------------------------------------------------------------
            #  Estas fallan el deploy
            # ------------------------------------------------------------------

            echo "-> backend responde y llega a Postgres"
            curl -fsS http://127.0.0.1:5000/api/health > /dev/null

            echo "-> print-service responde"
            curl -fsS http://127.0.0.1:8001/health > /dev/null

            echo "-> el frontend se sirve de verdad (no un 403 ni un index vacio)"
            curl -fsS https://edindumentaria.store/ | grep -q 'id="root"'

            echo "-> no quedaron migraciones sin aplicar"
            cd ~/app/backend && npx prisma migrate status

            # Si esto se rompe, los remitos se numeran mal despues de las 21:00
            # (cod_mes sale del mes del servidor) y nadie se entera hasta fin de mes.
            echo "-> zona horaria de la base"
            psql -tAc "SHOW TimeZone;" | grep -qx "America/Buenos_Aires"

            # Prisma no modela los triggers: si se pierden en una migracion, los
            # articulos dejan de recibir barcode y los remitos, codigo.
            echo "-> los 3 triggers siguen vivos"
            test "$(psql -tAc 'SELECT count(*) FROM information_schema.triggers;')" = "3"

            # Una secuencia desincronizada hace que el proximo INSERT choque
            # contra la primary key. Es silencioso hasta la primera venta.
            #
            # El nombre esta escrito a mano porque en esta base son inconsistentes
            # (REMITOS_id_remito_seq va en mayusculas, articulos_id_articulo_seq
            # en minusculas). Para re-derivarlo:
            #   SELECT pg_get_serial_sequence('"ARTICULOS"','id_articulo');
            # Es >= y no >: recien despues de un alta, last_value == MAX(id).
            echo "-> la secuencia de ARTICULOS no quedo atras de los datos"
            test "$(psql -tAc 'SELECT (SELECT last_value FROM public.articulos_id_articulo_seq) >= (SELECT COALESCE(MAX(id_articulo),0) FROM "ARTICULOS");')" = "t"

            # ------------------------------------------------------------------
            #  Estas solo avisan: son condiciones del local, no defectos del deploy
            # ------------------------------------------------------------------

            # El sistema soporta varias impresoras: se avisa si NINGUNA esta
            # conectada. Que falte una en particular no se puede saber desde
            # aca (puede estar apagada a proposito), por eso se imprime el
            # estado completo para poder leerlo en el log del deploy.
            ESTADO_IMPRESORAS=$(curl -fsS http://127.0.0.1:8001/health || echo '{}')
            echo "-> estado del print-service: $ESTADO_IMPRESORAS"

            echo "$ESTADO_IMPRESORAS" | grep -q '"conectada": *true' \
              && echo "-> hay al menos una impresora conectada" \
              || echo "AVISO: ninguna impresora del local esta conectada"

            echo "-> impresoras activas registradas: $(psql -tAc 'SELECT count(*) FROM "IMPRESORAS" WHERE activa;' || echo '?')"

            echo "Deploy verificado."